<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro // Professional Productivity Dashboard</title>
    <!-- CSS Stylesheet Link -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons for UI Elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="app-container" role="main">
        <!-- Dashboard Header & Progress Indicator -->
        <header class="app-header">
            <div class="header-text">
                <h1>TaskFlow Pro</h1>
                <p>Advanced Enterprise Task & Objective Manager</p>
            </div>
            <div class="stats-badge" id="task-stats-badge" aria-label="Task completion statistics">
                0% Completed
            </div>
        </header>

        <!-- Visual Progress Bar -->
        <div class="progress-bar-container" aria-hidden="true">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>

        <!-- Task Input Form Section -->
        <section class="input-section" aria-label="Create new task">
            <div class="input-row">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="What is your next professional objective?" 
                    aria-label="New task description" 
                    autocomplete="off"
                >
                <input 
                    type="date" 
                    id="due-date-input" 
                    aria-label="Task due date"
                >
                <button id="add-btn" class="btn-primary" aria-label="Add task button">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
            <div id="validation-msg" class="validation-message" aria-live="polite"></div>
        </section>

        <!-- Filter Tabs & Counter Section -->
        <section class="controls-section" aria-label="Task filtering controls">
            <div class="filter-tabs" role="tablist">
                <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All Tasks</button>
                <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
            </div>
            <div class="counter-display" id="counter-display" aria-live="polite">
                0 items remaining
            </div>
        </section>

        <!-- Dynamic Task List Container -->
        <section class="list-section" aria-label="Task list container">
            <ul id="task-list" class="task-list">
                <!-- Dynamic tasks will be inserted here via JavaScript -->
            </ul>
        </section>

        <!-- Footer Bulk Actions -->
        <footer class="app-footer">
            <div class="quick-stats" id="quick-stats">
                Total: 0 | Active: 0 | Completed: 0
            </div>
            <button id="clear-completed-btn" class="btn-secondary" aria-label="Clear all completed tasks">
                <i class="fas fa-trash-alt"></i> Clear Completed
            </button>
        </footer>
    </main>

    <!-- JavaScript Application Logic -->
    <script src="script.js"></script>
</body>
</html>
